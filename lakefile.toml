name = "jsp-000301-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["JSP000301"]

# Written with the Lean module system, matching Mathlib on this toolchain.
requiresModuleSystem = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "JSP000301"
