name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject sorry and admit in Lean sources
        run: python3 .github/quality/check_no_sorry.py
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          # Fail if any declaration depends on sorryAx, native_decide, or another
          # axiom outside the standard kernel trio.
          axiom-audit: true
      - name: Axiom audit
        run: |
          set -euo pipefail
          out="$(lake env lean Audit.lean)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -F -q sorryAx; then
            echo "error: an audited theorem depends on sorryAx" >&2
            exit 1
          fi
